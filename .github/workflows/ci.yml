name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep the newest run per branch. Pushes to main are never cancelled so every
# merged commit keeps a completed verification result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json requires >=22.13.0.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `npm test` runs `vinext build` first, so this also covers the build.
      - run: npm test
